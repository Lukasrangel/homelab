# Limites de requisições, permite rate/tempo (5requests/segundo ou minuto conexões por segundo por IP
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=login_ip:10m rate=18r/m;

# Contagem de conexões simultâneas por IP
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

# Formato do log gerado
log_format security
    '$remote_addr host=$host '
    '"$request_method $uri" '
    'status=$status limit=$limit_req_status '
    'conn=$connection_requests';
